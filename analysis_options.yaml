# The analysis options for the whole repository, and for each published package
# individually: `packages/*/analysis_options.yaml` is a symlink to this file.
#
# A package has to carry its own copy, because the archive pub.dev receives is
# the package directory and nothing above it. Without one the published code is
# formatted by the default rules, which disagree with every trailing comma this
# repository keeps open, and that costs ten points of the pub score. An
# `include:` reaching out of the package cannot replace it — the path dangles
# in the archive and the analyzer reports `include_file_not_found`, which costs
# the same ten points. A symlink is the way to keep one file: `dart pub
# publish` follows it and writes a real file into the archive.
include: package:lint/strict.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore
  exclude:
    # Written from the MusicXML schema and the SMuFL metadata by the tools in
    # each package. Nobody edits them by hand, so holding them to a house style
    # says nothing about the house.
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - unnecessary_parenthesis

formatter:
  # Since Dart 3.7 the formatter joins a parameter or argument list onto one
  # line whenever it fits, deleting the trailing comma that used to hold it
  # open. Preserving the comma gives that control back, which is what keeps
  # every constructor in this repository split one parameter per line.
  trailing_commas: preserve
